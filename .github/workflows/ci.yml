name: CI

on:
  push:
    branches: [main, plan/mejoras]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, bcmath, gd, exif, intl, pdo_sqlite, sqlite3
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Install and build front-end assets
        run: |
          npm ci
          npm run build

      - name: Prepare SQLite test database
        run: |
          mkdir -p database
          touch database/testing.sqlite

      - name: Run tests
        run: php artisan test --display-skipped

  a11y:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, bcmath, gd, exif, intl, pdo_sqlite, sqlite3
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare the app with the seeder
        run: |
          cp .env.example .env
          composer install --prefer-dist --no-interaction --no-progress
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate:fresh --seed --force
          npm ci
          npm run build

      - name: Start the server
        run: |
          php artisan serve --port=8000 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000 > /dev/null && exit 0; sleep 1; done
          cat /tmp/serve.log; exit 1

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Accessibility (axe, 390 and 1440 px)
        run: node tests/browser/a11y.spec.mjs

      - name: Seat map with the keyboard
        run: node tests/browser/seat-map.spec.mjs

      - name: Motion (scroll, reduced motion, no horizontal scroll)
        run: node tests/browser/movimiento.spec.mjs
