# Fly.io — configuración de despliegue
# Despliega con:  fly launch --copy-config --now   (o  fly deploy)
app = "cineflow"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  DB_CONNECTION = "sqlite"
  DB_DATABASE = "/data/database.sqlite"
  SESSION_DRIVER = "file"
  CACHE_STORE = "file"
  QUEUE_CONNECTION = "sync"
  MOVIES_API_ENABLED = "false"
  PORT = "8000"

# Volumen persistente para que las reservas de SQLite sobrevivan a los reinicios.
[[mounts]]
  source = "cineflow_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/"
